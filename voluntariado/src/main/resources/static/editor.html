<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Web - Tokniuan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
<!-- MENÚ DE NAVEGACIÓN DEL PANEL -->
    <nav class="menu-admin">
        <a href="admin.html">👥 Gestión</a>
        <a href="editor.html">📝 Editor</a>
        <a href="index.html" target="_blank">🌐 Ver sitio público</a>
    </nav>

<h1>Panel de Control Web</h1>

<!-- AQUÍ PONEMOS EL FORMULARIO DEL CMS -->
<section class="admin-section">
    <h2 style="text-align: center;">📝 Editor de la Página Principal</h2>
    <p>Los cambios realizados aquí se reflejarán inmediatamente en la página principal.</p>

    <form id="form-cms">
        <div style="margin-bottom: 15px;">
            <label><strong>Título Principal:</strong></label><br>
            <input type="text" id="input_titulo_principal" style="width: 100%; padding: 8px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label><strong>Fecha de Próxima Reunión o Evento:</strong></label><br>
            <input type="text" id="input_fecha_proxima_reunion" style="width: 100%; padding: 8px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label><strong>Anuncio / Llamado a la acción:</strong></label><br>
            <textarea id="input_mensaje_anuncio" rows="3" style="width: 100%; padding: 8px;"></textarea>
        </div>

        <div style="margin-bottom: 20px; padding: 15px; border: 1px dashed #ccc; border-radius: 5px; background: #fafafa;">
            <label><strong>📷 Imagen Principal del Evento:</strong></label><br>
            <p style="font-size: 13px; color: #666;">Selecciona una imagen (.jpg, .png).</p>
            <input type="file" id="input_archivo_evento" accept="image/*" style="margin-bottom: 10px;">
            <div>
                <img id="preview_imagen" src="" alt="Vista previa" style="max-width: 400px; margin-top: 10px;">
            </div>
        </div>

        <button type="submit" style="padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Guardar Cambios en la Web
        </button>
    </form>
</section>

<!-- Conectamos su propio archivo Javascript -->
<script src="editor.js"></script>
</body>
</html>
