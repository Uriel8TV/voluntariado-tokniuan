<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Coordinadores - Tokniuan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
<header>
    <!-- MENÚ DE NAVEGACIÓN DEL PANEL -->
    <nav class="menu-admin" style="background: #333; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <a href="admin.html" style="color: white; text-decoration: none; margin-right: 20px; font-weight: bold;">👥 Gestión de Voluntarios</a>
        <a href="editor.html" style="color: white; text-decoration: none; margin-right: 20px; font-weight: bold;">📝 Editor de la Página Principal</a>
        <a href="index.html" target="_blank" style="color: white; text-decoration: none; font-weight: bold;">🌐 Ver sitio público</a>
    </nav>
</header>

<section class="admin-section">
    <h1>Panel De Administrador Tokniuan</h1>
    <h2>Lista de Aspirantes a Voluntarios</h2>
    <p>Aquí aparecen todos los jóvenes que desean unirse a la familia.</p>

    <div class="table-container">

        <div style="margin-bottom: 20px;">
            <input type="text" id="input-busqueda"
                   placeholder="🔍 Buscar por nombre, correo o teléfono..."
                   style="width: 100%; padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box;">
        </div>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Teléfono</th>
                <th>Motivo</th>
                <th>Contactado</th>
                <th>Medio de Contacto</th>
            </tr>
            </thead>
            <tbody id="lista-voluntarios">
            <tr>
                <td colspan="7" style="text-align: center;">Cargando datos...</td>
            </tr>
            </tbody>
        </table>
    </div>
    </section>
<script src="admin.js"></script>
