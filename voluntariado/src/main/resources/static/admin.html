    <h2>Lista de Aspirantes a Voluntarios</h2>

    <div class="table-container">

        <div style="display: flex; justify-content: center; margin: 30px 0;">
            <form id="form-busqueda" style="width: 100%; max-width: 500px;">

        <table>
            <thead>
            <tr>
                <th>ID</th>

                <th>Motivo</th>
                <th>Contactado</th>
                <th>Medio de Contacto</th>
            </tr>
            </thead>
            <tbody id="lista-voluntarios">
            <tr>
                <td colspan="7" style="text-align: center;">Cargando datos...</td>
            </tr>
            </tbody>
