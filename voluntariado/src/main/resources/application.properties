
# Nombre de nuestra base de datos en memoria
# Cambiamos "mem" por "file:./datos_tokniuan/basedatos"
# Esto creara una carpeta llamada "datos_tokniuan" en tu proyecto con un archivo adentro.
spring.datasource.url=jdbc:h2:file:./datos_tokniuan/basedatos
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Le decimos a Java que cree las tablas automaticamente
spring.jpa.hibernate.ddl-auto=update

# Habilitamos una consola web para ver los datos guardados
spring.h2.console.enabled=true

# Credenciales para el Panel de Control
spring.security.user.name=coordinador
spring.security.user.password=tokniuan2026
